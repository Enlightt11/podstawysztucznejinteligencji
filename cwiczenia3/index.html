<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pathfinding – Best First Search / Dijkstra / A*</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: #0f0f1a;
            color: #e0e0f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin-top: 24px;
            font-size: 1.6rem;
            font-weight: 700;
            background: linear-gradient(135deg, #6ee7b7, #3b82f6, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .app {
            display: flex;
            gap: 24px;
            margin-top: 20px;
            padding: 0 24px 24px;
            max-width: 1300px;
            width: 100%;
        }

        .sidebar {
            width: 300px;
            min-width: 260px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .card {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            padding: 18px;
            backdrop-filter: blur(12px);
        }

        .card h2 {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: #8b8ba7;
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 0.82rem;
            color: #aaa;
            margin-bottom: 4px;
            margin-top: 10px;
        }
        label:first-of-type { margin-top: 0; }

        select, input[type="file"] {
            width: 100%;
            padding: 8px 12px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 8px;
            color: #e0e0f0;
            font-size: 0.88rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }
        select:hover, select:focus {
            border-color: rgba(110,231,183,0.5);
        }
        select option { background: #1a1a2e; }

        .btn-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            padding: 10px 8px;
            border: none;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-step {
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            color: white;
        }
        .btn-step:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(59,130,246,0.35); }

        .btn-run {
            background: linear-gradient(135deg, #10b981, #06b6d4);
            color: white;
        }
        .btn-run:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(16,185,129,0.35); }

        .btn-reset {
            background: rgba(255,255,255,0.08);
            color: #ccc;
            flex: 0.6;
        }
        .btn-reset:hover { background: rgba(255,255,255,0.14); }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        .speed-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 6px;
        }
        .speed-row input[type="range"] {
            flex: 1;
            accent-color: #6ee7b7;
        }
        .speed-row span {
            font-size: 0.8rem;
            color: #8b8ba7;
            min-width: 45px;
            text-align: right;
        }

        .stat {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 0.88rem;
        }
        .stat:last-child { border-bottom: none; }
        .stat .val {
            font-weight: 600;
            color: #6ee7b7;
        }

        .legend {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            color: #aaa;
        }
        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 1.5px solid rgba(255,255,255,0.15);
        }

        .canvas-wrap {
            flex: 1;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            min-height: 500px;
        }

        canvas {
            display: block;
            cursor: crosshair;
        }

        .instructions {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #555;
            font-size: 0.95rem;
            pointer-events: none;
        }
        .instructions.hidden { display: none; }

        .node-info {
            font-size: 0.82rem;
            color: #999;
            margin-top: 8px;
            min-height: 1.2em;
        }

        @media (max-width: 850px) {
            .app { flex-direction: column; }
            .sidebar { width: 100%; }
        }
    </style>
</head>

// ───────────────────── Graph parser ─────────────────────
function parseGraph(text) {
    const lines = text.trim().split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
    const n = parseInt(lines[0]);
    const nodes = []; // 0-indexed internally; node i from file → index i-1
    for (let i = 1; i <= n; i++) {
        const parts = lines[i].split(/\s+/).map(Number);
        nodes.push({ x: parts[0], y: parts[1], neighbors: [] });
    }
    for (let i = 0; i < n; i++) {
        const parts = lines[n + 1 + i].split(/\s+/).map(Number);
        const count = parts[0];
        for (let j = 1; j <= count; j++) {
            nodes[i].neighbors.push(parts[j] - 1); // convert to 0-indexed
        }
    }
    return nodes;
}

// ───────────────────── Priority Queue (min-heap) ─────────────────────
class MinHeap {
    constructor() { this.data = []; }
    push(item) {
        this.data.push(item);
        this._bubbleUp(this.data.length - 1);
    }
    pop() {
        const top = this.data[0];
        const last = this.data.pop();
        if (this.data.length > 0) {
            this.data[0] = last;
            this._sinkDown(0);
        }
        return top;
    }
    get size() { return this.data.length; }
    _bubbleUp(i) {
        while (i > 0) {
            const p = (i - 1) >> 1;
            if (this.data[p].priority <= this.data[i].priority) break;
            [this.data[p], this.data[i]] = [this.data[i], this.data[p]];
            i = p;
        }
    }
    _sinkDown(i) {
        const n = this.data.length;
        while (true) {
            let smallest = i;
            const l = 2 * i + 1, r = 2 * i + 2;
            if (l < n && this.data[l].priority < this.data[smallest].priority) smallest = l;
            if (r < n && this.data[r].priority < this.data[smallest].priority) smallest = r;
            if (smallest === i) break;
            [this.data[smallest], this.data[i]] = [this.data[i], this.data[smallest]];
            i = smallest;
        }
    }
}

// ───────────────────── Euclidean distance ─────────────────────
function dist(a, b) {
    return Math.sqrt((a.x - b.x) ** 2 + (a.y - b.y) ** 2);
}

// ───────────────────── Load graph ─────────────────────
function loadGraph(text) {
    nodes = parseGraph(text);
    startNode = -1;
    endNode = -1;
    resetAlgorithm();
    instructions.classList.add('hidden');
    nodeInfo.textContent = 'Kliknij węzeł aby ustawić start (zielony)';
    fitCanvas();
    draw();
}

graphSelect.addEventListener('change', () => {
    const key = graphSelect.value;
    if (GRAPHS[key]) loadGraph(GRAPHS[key]);
});

fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => loadGraph(ev.target.result);
    reader.readAsText(file);
});

// ───────────────────── Canvas sizing ─────────────────────
function fitCanvas() {
    const rect = canvasWrap.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    canvas.style.width = rect.width + 'px';
    canvas.style.height = rect.height + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    if (nodes.length === 0) return;

    const xs = nodes.map(n => n.x);
    const ys = nodes.map(n => n.y);
    const minX = Math.min(...xs), maxX = Math.max(...xs);
    const minY = Math.min(...ys), maxY = Math.max(...ys);
    const rangeX = maxX - minX || 1;
    const rangeY = maxY - minY || 1;

    const drawW = rect.width - padding * 2;
    const drawH = rect.height - padding * 2;
    scaleX = drawW / rangeX;
    scaleY = drawH / rangeY;
    const s = Math.min(scaleX, scaleY);
    scaleX = scaleY = s;
    offsetX = padding + (drawW - rangeX * s) / 2 - minX * s;
    offsetY = padding + (drawH - rangeY * s) / 2 - minY * s;

    nodeRadius = Math.max(8, Math.min(22, s * 0.28));
}

function toScreen(node) {
    return { x: node.x * scaleX + offsetX, y: node.y * scaleY + offsetY };
}

window.addEventListener('resize', () => { fitCanvas(); draw(); });

// ───────────────────── Drawing ─────────────────────
function getNodeColor(i) {
    if (i === startNode) return '#34d399';
    if (i === endNode) return '#f87171';
    if (pathNodes && pathNodes.has(i)) return '#60a5fa';
    if (closedSet && closedSet.has(i)) return '#64748b';
    if (openSetNodes && openSetNodes.has(i)) return '#fbbf24';
    return '#e2e8f0';
}

function getNodeGlow(i) {
    if (i === startNode) return 'rgba(52,211,153,0.45)';
    if (i === endNode) return 'rgba(248,113,113,0.45)';
    if (pathNodes && pathNodes.has(i)) return 'rgba(96,165,250,0.35)';
    return null;
}

function draw() {
    const rect = canvasWrap.getBoundingClientRect();
    ctx.clearRect(0, 0, rect.width, rect.height);

    if (nodes.length === 0) return;

    // Draw edges
    ctx.lineWidth = 1.5;
    for (let i = 0; i < nodes.length; i++) {
        const a = toScreen(nodes[i]);
        for (const j of nodes[i].neighbors) {
            if (j > i) {
                const b = toScreen(nodes[j]);
                let edgeOnPath = pathNodes && pathNodes.has(i) && pathNodes.has(j) && arePathNeighbors(i, j);
                if (edgeOnPath) {
                    ctx.strokeStyle = 'rgba(96,165,250,0.8)';
                    ctx.lineWidth = 3.5;
                } else {
                    ctx.strokeStyle = 'rgba(255,255,255,0.12)';
                    ctx.lineWidth = 1.5;
                }
                ctx.beginPath();
                ctx.moveTo(a.x, a.y);
                ctx.lineTo(b.x, b.y);
                ctx.stroke();
            }
        }
    }

    // Draw nodes
    for (let i = 0; i < nodes.length; i++) {
        const p = toScreen(nodes[i]);
        const color = getNodeColor(i);
        const glow = getNodeGlow(i);

        if (glow) {
            ctx.beginPath();
            ctx.arc(p.x, p.y, nodeRadius + 6, 0, Math.PI * 2);
            ctx.fillStyle = glow;
            ctx.fill();
        }

        ctx.beginPath();
        ctx.arc(p.x, p.y, nodeRadius, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,0.3)';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // Node label
        ctx.fillStyle = '#111';
        ctx.font = `${Math.max(9, nodeRadius * 0.7)}px Inter, sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(i + 1, p.x, p.y);  // display 1-indexed
    }
}

function arePathNeighbors(i, j) {
    if (!cameFrom) return false;
    return (cameFrom.get(i) === j || cameFrom.get(j) === i);
}

// ───────────────────── Node selection via click ─────────────────────
canvas.addEventListener('click', (e) => {
    if (nodes.length === 0) return;
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;

    let closest = -1, closestDist = Infinity;
    for (let i = 0; i < nodes.length; i++) {
        const p = toScreen(nodes[i]);
        const d = Math.sqrt((mx - p.x) ** 2 + (my - p.y) ** 2);
        if (d < closestDist && d < nodeRadius + 10) {
            closest = i;
            closestDist = d;
        }
    }
    if (closest === -1) return;

    if (startNode === -1) {
        startNode = closest;
        nodeInfo.textContent = `Start: węzeł ${closest + 1}. Kliknij inny węzeł jako cel.`;
    } else if (endNode === -1) {
        if (closest === startNode) return;
        endNode = closest;
        nodeInfo.textContent = `Start: ${startNode + 1} → Cel: ${endNode + 1}`;
        resetAlgorithm();
        btnStep.disabled = false;
        btnRun.disabled = false;
        statStatus.textContent = 'Gotowy';
    } else {
        // Reset and re-select
        startNode = closest;
        endNode = -1;
        resetAlgorithm();
        nodeInfo.textContent = `Start: węzeł ${closest + 1}. Kliknij inny węzeł jako cel.`;
        btnStep.disabled = true;
        btnRun.disabled = true;
    }
    draw();
});

// ───────────────────── Algorithm ─────────────────────
function resetAlgorithm() {
    stopRunning();
    openSet = null;
    closedSet = null;
    gScore = null;
    cameFrom = null;
    openSetNodes = null;
    pathNodes = null;
    steps = 0;
    finished = false;
    foundPath = false;
    updateStats();
    statStatus.textContent = startNode >= 0 && endNode >= 0 ? 'Gotowy' : 'Wybierz węzły';
    statPath.textContent = '—';
}

function initAlgorithm() {
    openSet = new MinHeap();
    closedSet = new Set();
    gScore = new Map();
    cameFrom = new Map();
    openSetNodes = new Set();
    pathNodes = null;
    steps = 0;
    finished = false;
    foundPath = false;

    gScore.set(startNode, 0);
    const pri = computePriority(startNode);
    openSet.push({ node: startNode, priority: pri });
    openSetNodes.add(startNode);
}

function computePriority(nodeIdx) {
    const algo = algoSelect.value;
    const g = gScore.get(nodeIdx) || 0;
    const h = dist(nodes[nodeIdx], nodes[endNode]);
    if (algo === 'astar') return g + h;
    if (algo === 'dijkstra') return g;
    if (algo === 'bestfirst') return h;
    return g + h;
}

function algorithmStep() {
    if (finished) return;
    if (!openSet || openSet.size === 0) {
        if (!openSet) initAlgorithm();
        if (openSet.size === 0 && steps > 0) {
            finished = true;
            statStatus.textContent = 'Brak ścieżki!';
            stopRunning();
            return;
        }
    }
    if (openSet.size === 0) return;

    const current = openSet.pop();
    const u = current.node;
    openSetNodes.delete(u);

    // If already processed with a better cost, skip
    if (closedSet.has(u)) {
        // Don't count as a step, try next
        if (openSet.size > 0) {
            algorithmStep();
        } else {
            finished = true;
            statStatus.textContent = 'Brak ścieżki!';
            stopRunning();
        }
        return;
    }

    closedSet.add(u);
    steps++;

    // Found the goal?
    if (u === endNode) {
        finished = true;
        foundPath = true;
        reconstructPath();
        statStatus.textContent = 'Znaleziono ścieżkę!';
        stopRunning();
        updateStats();
        draw();
        return;
    }

    // Expand neighbors
    for (const v of nodes[u].neighbors) {
        if (closedSet.has(v)) continue;
        const tentativeG = (gScore.get(u) || 0) + dist(nodes[u], nodes[v]);
        if (!gScore.has(v) || tentativeG < gScore.get(v)) {
            gScore.set(v, tentativeG);
            cameFrom.set(v, u);
            const pri = computePriority(v);
            openSet.push({ node: v, priority: pri });
            openSetNodes.add(v);
        }
    }

    updateStats();
    draw();
}

function reconstructPath() {
    pathNodes = new Set();
    let cur = endNode;
    let totalCost = 0;
    const pathList = [cur];
    while (cameFrom.has(cur)) {
        const prev = cameFrom.get(cur);
        totalCost += dist(nodes[prev], nodes[cur]);
        pathList.push(prev);
        cur = prev;
    }
    for (const n of pathList) pathNodes.add(n);
    statPath.textContent = totalCost.toFixed(2);
}

function updateStats() {
    statSteps.textContent = steps;
    statOpen.textContent = openSetNodes ? openSetNodes.size : 0;
    statClosed.textContent = closedSet ? closedSet.size : 0;
}

// ───────────────────── Controls ─────────────────────
btnStep.addEventListener('click', () => {
    if (finished) return;
    if (!openSet) initAlgorithm();
    algorithmStep();
});

btnRun.addEventListener('click', () => {
    if (finished) return;
    if (running) { stopRunning(); return; }
    if (!openSet) initAlgorithm();
    running = true;
    btnRun.textContent = '⏸ Pauza';
    runLoop();
});

function runLoop() {
    if (!running || finished) { stopRunning(); return; }
    algorithmStep();
    if (!finished && running) {
        animTimer = setTimeout(runLoop, parseInt(speedSlider.value));
    }
}

function stopRunning() {
    running = false;
    clearTimeout(animTimer);
    animTimer = null;
    btnRun.textContent = '▶ Start';
}

btnReset.addEventListener('click', () => {
    resetAlgorithm();
    if (startNode >= 0 && endNode >= 0) {
        btnStep.disabled = false;
        btnRun.disabled = false;
    }
    draw();
});

speedSlider.addEventListener('input', () => {
    speedVal.textContent = speedSlider.value + 'ms';
});

algoSelect.addEventListener('change', () => {
    resetAlgorithm();
    if (startNode >= 0 && endNode >= 0) {
        btnStep.disabled = false;
        btnRun.disabled = false;
    }
    draw();
});

// ───────────────────── Init ─────────────────────
loadGraph(GRAPHS['graf1']);
</script>
